apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: payroll
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: payroll
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer
  namespace: payroll
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer
subjects:
  - kind: User
    name: developer
---
apiVersion: v1
kind: Secret
metadata:
  name: database
  namespace: payroll
  labels:
    identity-attack-graph.io/crown-jewel: "true"
    identity-attack-graph.io/impact: "90"
type: Opaque
data:
  password: c3ludGhldGljLW5vdC1hLXNlY3JldA==
---
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: payroll
spec:
  serviceAccountName: web
  containers:
    - name: web
      image: registry.k8s.io/pause:3.10
