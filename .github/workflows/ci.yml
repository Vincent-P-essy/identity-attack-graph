name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IDENTITY_GRAPH_SOURCE_REVISION: ${{ github.sha }}
  IDENTITY_GRAPH_SOURCE_TREE_STATE: clean-checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: test "$(uv run python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "${{ matrix.python-version }}"
      - run: uv lock --check
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=identity_attack_graph --cov-report=xml
      - run: uv run identity-graph benchmark --out /tmp/benchmark --iterations 20
      - run: sha256sum --check benchmarks/reference/inputs.sha256
      - run: docker compose config --quiet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-attack-graph-evidence-py${{ matrix.python-version }}
          path: |
            coverage.xml
            /tmp/benchmark

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: identity-attack-graph:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the packaged benchmark with deployment constraints
        run: >-
          docker run --rm --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --pids-limit=128
          --memory=256m --cpus=1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          --env IDENTITY_GRAPH_SOURCE_REVISION --env IDENTITY_GRAPH_SOURCE_TREE_STATE
          identity-attack-graph:ci benchmark --out /tmp/benchmark
          --iterations 5
      - name: Assert the runtime identity
        run: test "$(docker image inspect --format '{{.Config.User}}' identity-attack-graph:ci)" = "10001:10001"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.23"
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Install and smoke-test the wheel outside the repository
        run: |
          uv venv --python 3.12 /tmp/identity-wheel
          uv pip install --python /tmp/identity-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/identity-wheel/bin/python "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
      - name: Test the source distribution contents
        run: |
          mkdir /tmp/identity-sdist
          tar -xzf dist/*.tar.gz -C /tmp/identity-sdist
          cd /tmp/identity-sdist/identity_attack_graph-*
          uv sync --frozen --all-extras
          uv run pytest -q
